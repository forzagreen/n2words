name: Pages

env:
  HUSKY: 0
  CI: true

# Deploys the demo site at https://forzagreen.github.io/n2words/.
#
# The site is assembled from three things, all built here rather than
# committed: the pages in site/, the real Rollup bundles from dist/, and a
# languages.json generated from src/. The demo imports those bundles at
# runtime, so what the site demonstrates is always the code at the deployed
# commit — there is no snapshot to refresh by hand.
#
# Requires repository Settings -> Pages -> Source = "GitHub Actions".
#
# A release needs no trigger of its own. release.yml has GitHub write the
# chore(release) commit with the release App's token, whose events start
# workflows where the GITHUB_TOKEN's do not, so the commit arrives as an
# ordinary push to main. `release: published` would not do instead: the
# `github-pages` environment allows deployments from `main` alone, and a
# release event runs against the tag, so the site built for two minutes and
# was then rejected with "Tag v6.1.1 is not allowed to deploy to github-pages".
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a deploy in progress; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `actions/configure-pages` calls the Pages API (`GET /repos/{o}/{r}/pages`)
    # to resolve the site's base URL, and a workflow-level `permissions:` block
    # sets every scope it doesn't list to `none`. It works today only because
    # this repo is public and that endpoint is readable anonymously; the read
    # scope is what actually entitles it. Deploy keeps its own write scopes.
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # dist/ is what the demo actually imports, so the site can't be built
      # without it — same build the package publishes.
      - name: Build bundles
        run: npm run build

      - name: Assemble site
        run: npm run site:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
