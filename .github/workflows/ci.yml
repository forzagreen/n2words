name: CI

env:
  HUSKY: 0
  CI: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per check, so a red check names what failed. A job's name is the
# check name a ruleset requires, so renaming one is a protection change.
jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    # Downloads one binary and lints the workflows; there is no `npm ci`.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installer URL and binary version are pinned to the same tag —
      # `main` is mutable and would defeat supply-chain immutability
      # even if the binary itself is pinned.
      #
      # The two `-ignore` patterns cover one known gap: release.yml passes
      # `client-id` to actions/create-github-app-token@v3 (v3 deprecates
      # `app-id` and warns on every run), but actionlint's bundled metadata
      # for that action predates the input, so it reports `client-id` as
      # unknown and `app-id` as missing. Both patterns name the action, so
      # any other input mistake in any workflow still fails. Drop them once
      # a pinned actionlint knows `client-id`.
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color \
            -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@v3"' \
            -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # Fetches audit-ci and reads the lockfile; there is no `npm ci`.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `cache: 'npm'`. setup-node saves the cache under the lockfile's key
      # when the job ends, and the first job to finish wins the key: this one,
      # holding only audit-ci, would leave every other job restoring a cache
      # without the dependencies until the lockfile next changes.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # audit-ci runs `npm audit` at high severity and sets aside only the
      # advisories listed in audit-ci.jsonc, each with its reason and expiry.
      # It reads just the lockfile, so no dependency's install script runs
      # ahead of the audit; that is also why it comes through npx rather than
      # as a devDependency. The version is pinned, but its own dependencies
      # resolve fresh on each run.
      - name: Security audit
        run: npx --yes audit-ci@7.1.0 --config ./audit-ci.jsonc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Linting runs in well under a minute; the budget exists for `npm ci`,
    # which is unpredictable whenever a lockfile change invalidates the
    # setup-node cache. 10 matches the test jobs.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Same budget as Lint, for `npm ci`.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Strict checkJs over src (tsconfig.build.json, noEmit). The shipped
      # declarations are independently gated by build:types (checkJs +
      # noEmitOnError) in the test jobs and prepack.
      - name: Typecheck
        run: npm run typecheck

  site-data:
    name: Site Data
    runs-on: ubuntu-latest
    # Same budget as Lint, for `npm ci`.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # The demo site's manifest is generated from src/ at deploy time, and
      # pages.yml only runs on main — so a language whose shape the generator
      # can't read used to pass every PR gate and surface after merge, as a red
      # deploy with the site still serving the previous commit's bundles. The
      # generator imports every language and reads its declarations, which is
      # the part that can break; dist/ is not needed (bundle sizes come back
      # null), so this costs seconds rather than a full build.
      - name: Generate site data
        run: node scripts/generate-site-data.js "$RUNNER_TEMP/languages.json"

  test:
    name: Test (Node ${{ matrix.node }}${{ matrix.coverage && ' + Coverage' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
        coverage: [false]
        include:
          - node: '24'
            coverage: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: npm test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: npm run coverage

      - name: Check coverage thresholds
        if: ${{ matrix.coverage }}
        run: npm run coverage:check

      - name: Generate coverage summary
        if: ${{ matrix.coverage }}
        continue-on-error: true
        run: |
          {
            echo "## 📊 Coverage Report"
            echo ""

            if [ -f coverage/coverage-summary.json ] && command -v jq &> /dev/null; then
              TOTAL=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
              STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
              BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
              FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)

              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| **Lines** | ${TOTAL}% |"
              echo "| Statements | ${STATEMENTS}% |"
              echo "| Branches | ${BRANCHES}% |"
              echo "| Functions | ${FUNCTIONS}% |"
            else
              echo "### ℹ️ Coverage data not available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Coveralls
        if: ${{ matrix.coverage }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false

      - name: Upload coverage artifacts
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # `npm pack --dry-run` runs the prepack script (node --run build), so this one
      # step both builds every artifact and verifies the published file list — a
      # failing build fails the pack. No separate build step needed.
      - name: Build & verify package contents
        run: npm pack --dry-run
